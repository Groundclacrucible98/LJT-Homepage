# Site settings
locale: "en-US"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu, PhD candidate in Computer Science at HKUST NLP Group"
url: "https://Groundclacrucible98.github.io"
baseurl: "/LJT-Homepage"
repository: "Groundclacrucible98/LJT-Homepage"

# Personal information
author:
  avatar: 
  name: "Junteng Liu"
  pronouns: 
  bio: "First-year PhD candidate in Computer Science at the Hong Kong University of Science and Technology, in the HKUST NLP Group with Professor Junxian He."
  location: 
  employer: 
  uri: 
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Site settings
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
comments:
  provider: 

# SEO and social
og_image: 
twitter:
  username: &twitter
facebook:
  username: 
  app_id: 
  publisher: 
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type: 
  name: 
  links: 

# Analytics
analytics:
  provider: "false"
  google:
    tracking_id: 

# Reading files
include:
  - _pages
exclude:
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - Gemfile
  - package.json*
  - README.md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      comments: false
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      comments: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
